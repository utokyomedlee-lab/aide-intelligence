services:
  - type: web
    name: aide-intelligence
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-6.1-sol
      - key: OPENAI_API_KEY
        sync: false
