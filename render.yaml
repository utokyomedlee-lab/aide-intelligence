services:
  - type: web
    name: aide-intelligence
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: unzip -o aide-intelligence-v0.3.0.zip
    startCommand: cd aide-intelligence-chat && npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_MODEL
        value: gpt-6.2-sol
      - key: OPENAI_API_KEY
        sync: false
